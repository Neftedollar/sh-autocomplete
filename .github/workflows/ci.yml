name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install zsh and fish on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude shac-ml-train --all-targets -- -D warnings

      # shac-ml-train's default `full` feature is a maintainer-local build (mistralrs + burn-autodiff, ~9.6 GB target dir — see ml/README.md); CI lints/tests it via `model-only scrub` instead.
      - name: Clippy (shac-ml-train, model-only + scrub)
        run: cargo clippy -p shac-ml-train --no-default-features --features "model-only scrub" --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --exclude shac-ml-train

      - name: Rust tests (shac-ml-train, model-only + scrub)
        run: cargo test -p shac-ml-train --no-default-features --features "model-only scrub"

      - name: Shell syntax
        run: |
          zsh -n shell/zsh/shac.zsh
          bash -n shell/bash/shac.bash
