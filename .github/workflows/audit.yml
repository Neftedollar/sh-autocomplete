name: Security Audit

on:
  # Manual only. The weekly schedule was removed deliberately: nothing here
  # polls for new advisories any more, so a CVE published against a dependency
  # will not surface on its own. Run this from the Actions tab before a release,
  # or when a dependency changes.
  workflow_dispatch:

permissions:
  contents: read
  # rustsec/audit-check reports findings by opening an issue and writing a check
  # run. Without these the action fails with "Resource not accessible by
  # integration" even when the audit itself found nothing.
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
