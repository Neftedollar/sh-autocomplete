name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: shac-linux-x86_64
          - os: macos-latest
            asset_name: shac-macos-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macos-latest is Apple Silicon; a plain build is arm64-only. Build
            # both Apple targets and lipo them into one genuinely universal
            # binary so the shac-macos-universal asset runs on Intel Macs too.
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --bins --target aarch64-apple-darwin
            cargo build --release --bins --target x86_64-apple-darwin
            mkdir -p target/release
            for b in shac shacd; do
              lipo -create -output "target/release/$b" \
                "target/aarch64-apple-darwin/release/$b" \
                "target/x86_64-apple-darwin/release/$b"
            done
            file target/release/shac target/release/shacd
          else
            cargo build --release --bins
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.asset_name }}/bin"
          cp target/release/shac "dist/${{ matrix.asset_name }}/bin/"
          cp target/release/shacd "dist/${{ matrix.asset_name }}/bin/"
          cp -R shell "dist/${{ matrix.asset_name }}/"
          cp README.md LICENSE "dist/${{ matrix.asset_name }}/"
          tar -C dist -czf "dist/${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset_name }}.tar.gz

  update-homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (formula template + render script)
        uses: actions/checkout@v6

      - name: Compute sha256 of release binaries
        id: sha
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          # `needs: build` guarantees both assets were uploaded, but the release
          # CDN can lag the API by a few seconds — retry until each is fetchable.
          fetch_sha() {
            name="$1"
            for i in $(seq 1 18); do
              if curl -fsSL -o "/tmp/${name}" "${base}/${name}"; then
                sha256sum "/tmp/${name}" | cut -d' ' -f1
                return 0
              fi
              echo "waiting for asset ${name} ($i/18)..." >&2
              sleep 10
            done
            echo "asset ${name} never became available" >&2
            return 1
          }
          echo "macos=$(fetch_sha shac-macos-universal.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "linux=$(fetch_sha shac-linux-x86_64.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-shac tap
        uses: actions/checkout@v6
        with:
          repository: Neftedollar/homebrew-shac
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-shac

      - name: Render tap formula
        env:
          TAG: ${{ github.ref_name }}
          MACOS_SHA: ${{ steps.sha.outputs.macos }}
          LINUX_SHA: ${{ steps.sha.outputs.linux }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          export SRC="Formula/shac.rb"
          export OUT="homebrew-shac/Formula/shac.rb"
          python3 .github/scripts/render_tap_formula.py
          echo "=== rendered tap formula ===" && cat "$OUT"

      - name: Commit and push
        run: |
          cd homebrew-shac
          git config user.email "ci@shac"
          git config user.name "shac-release-bot"
          git add Formula/shac.rb
          git diff --staged --quiet || git commit -m "chore: bump shac to ${{ github.ref_name }}"
          git push
