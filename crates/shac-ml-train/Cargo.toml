[package]
name = "shac-ml-train"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Maintainer pipeline for shac's ML next-command predictor — generates synthetic data, distills Qwen, trains the student, exports .bpk weights"
publish = false

[features]
# Default = full training pipeline (incl. autodiff + mistralrs).
# `model-only` = just the model + tokenizer + types, used by the shac runtime crate.
# `scrub` = privacy-critical scrub module/bin/tests plus the data/personas
# JSONL-and-TOML plumbing they and the pipeline-smoke test need — none of it
# touches mistralrs/burn-autodiff, so CI can compile+test it without the
# ~9.6 GB teacher stack. `full` includes `scrub`, so local default builds are
# unaffected.
default = ["full"]
full = ["scrub", "dep:mistralrs", "dep:burn-autodiff", "dep:burn-train", "dep:tokio"]
model-only = []
scrub = ["dep:shac"]

[dependencies]
# Root crate: single source of truth for secret patterns (import::SECRET_PATTERNS).
# Optional + gated behind `scrub` (pulled in by `full` too) so `model-only`
# (consumed by the shac runtime) cannot introduce a package dependency cycle.
shac = { path = "../..", optional = true }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
regex = "1"
ndarray = "0.16"

burn = { version = "=0.21.0-pre.4", default-features = false, features = ["std", "ndarray"] }
burn-store = { version = "=0.21.0-pre.4", default-features = false, features = ["std", "burnpack"] }

# optional, only enabled by `full`
burn-autodiff = { version = "=0.21.0-pre.4", optional = true, default-features = false }
burn-train = { version = "=0.21.0-pre.4", optional = true, default-features = false }
# NOTE: features = ["metal"] is intentionally NOT enabled here so that `cargo
# check` works on Linux CI without the Metal toolchain. CPU inference is
# functional but ~6× slower on M1. Re-enable Metal locally before any
# real training run (e.g., a maintainer-only build profile or a follow-up
# task that introduces a Cargo target_os conditional). See pipeline plan T1.
mistralrs = { version = "0.8", optional = true, default-features = false }
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "shac-ml-gen-synthetic"
path = "src/bin/gen_synthetic.rs"
required-features = ["full"]

[[bin]]
name = "shac-ml-scrub"
path = "src/bin/scrub.rs"
required-features = ["scrub"]

[[bin]]
name = "shac-ml-distill"
path = "src/bin/distill.rs"
required-features = ["full"]

[[bin]]
name = "shac-ml-train"
path = "src/bin/train.rs"
required-features = ["full"]

[[bin]]
name = "shac-ml-eval"
path = "src/bin/eval.rs"
required-features = ["full"]

# Autodiscovered test targets get explicit `required-features` here so a
# lightweight `--no-default-features --features "model-only scrub"` build
# skips whatever it can't satisfy instead of hitting a hard compile error
# (e.g. `train_eval_cli` shells out to the full-only train/eval binaries).
[[test]]
name = "scrub_redlist"
path = "tests/scrub_redlist.rs"
required-features = ["scrub"]

[[test]]
name = "personas_load"
path = "tests/personas_load.rs"
required-features = ["scrub"]

[[test]]
name = "pipeline_smoke"
path = "tests/pipeline_smoke.rs"
required-features = ["scrub"]

[[test]]
name = "train_eval_cli"
path = "tests/train_eval_cli.rs"
required-features = ["full"]
